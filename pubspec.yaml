name: learnwithleoni
description: "LearnwithLeoni – Deutsch und Bündnerdütsch lernen."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^18.1.3
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.2
  http: ^1.6.0
  web: ^1.1.2
  record: ^7.1.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/leoni/
    - assets/kuma/
    - assets/logo/logo.svg

  fonts:
    # Beide Schriften: SIL Open Font License, siehe assets/fonts/*-OFL.txt
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
